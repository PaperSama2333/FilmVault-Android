name: Signed arm64 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: filmvault-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.0.0 or v1.0.0-rc.1" >&2
            exit 1
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37.1 and arm64 toolchain
        run: sdkmanager "platforms;android-37.1" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required Actions secret: ${value}" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/filmvault-release.jks"
          chmod 600 "$RUNNER_TEMP/filmvault-release.jks"

      - name: Test and build signed arm64-v8a APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          gradle --no-daemon testDebugUnitTest lintRelease assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$GITHUB_RUN_NUMBER" \
            -PFILMVAULT_KEYSTORE_PATH="$RUNNER_TEMP/filmvault-release.jks" \
            -PFILMVAULT_KEYSTORE_PASSWORD="$STORE_PASSWORD" \
            -PFILMVAULT_KEY_ALIAS="$KEY_ALIAS" \
            -PFILMVAULT_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify signature and package ABI
        id: package
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -type f \( -name '*arm64-v8a*.apk' -o -name 'app-release.apk' \) | head -n 1)"
          if [[ -z "$APK_PATH" ]]; then
            echo "Release APK not found" >&2
            find app/build/outputs/apk -type f -maxdepth 5 || true
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          unzip -l "$APK_PATH" | grep -q 'lib/arm64-v8a/libfilmvault.so'
          if unzip -l "$APK_PATH" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected non-arm64 native ABI found" >&2
            exit 1
          fi
          RELEASE_NAME="FilmVault-${GITHUB_REF_NAME#v}-arm64-v8a.apk"
          cp "$APK_PATH" "$RUNNER_TEMP/$RELEASE_NAME"
          sha256sum "$RUNNER_TEMP/$RELEASE_NAME" > "$RUNNER_TEMP/$RELEASE_NAME.sha256"
          echo "apk=$RUNNER_TEMP/$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$RUNNER_TEMP/$RELEASE_NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.package.outputs.apk }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" "$CHECKSUM" \
            --verify-tag \
            --generate-notes \
            --title "FilmVault ${GITHUB_REF_NAME}"
